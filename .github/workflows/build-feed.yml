name: Build Feed (on demand)

# Runs one store's feed build in the background so the web app doesn't have to
# hold a browser connection open for the whole crawl (Streamlit Community
# Cloud drops long-running sessions, losing the result). Triggered by the web
# app via workflow_dispatch after its Turnstile check — see feed_tool/jobs.py.
#
# run-name carries the job id: the dispatch API doesn't return a run id, so the
# app finds its run by matching this title. The result is handed back as a
# short-lived artifact (nothing is committed to the repo).

run-name: build ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Random 32-char hex id generated by the web app"
        required: true
        type: string
      store_url:
        description: "Store URL to build a feed for"
        required: true
        type: string
      id_field:
        description: "Feed id source: default, sku or product_id"
        required: false
        default: "default"
        type: string
      max_pages:
        description: "Cap on generic-crawl pages (clamped by the script)"
        required: false
        default: "2000"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Inputs go through env vars, never interpolated into the shell script,
      # so a hostile value can't inject commands.
      - name: Build the feed
        env:
          JOB_ID: ${{ inputs.job_id }}
          STORE_URL: ${{ inputs.store_url }}
          ID_FIELD: ${{ inputs.id_field }}
          MAX_PAGES: ${{ inputs.max_pages }}
        run: >
          python scripts/build_feed_job.py
          --job-id "$JOB_ID"
          --store-url "$STORE_URL"
          --id-field "$ID_FIELD"
          --max-pages "$MAX_PAGES"
          --out-dir build_out

      - name: Hand the result back
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-${{ inputs.job_id }}
          path: build_out/
          retention-days: 1
          if-no-files-found: warn
